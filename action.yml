# action.yml
name: "Install Snowflake CLI"
description: "[Moved to snowflakedb/snowflake-actions] Download and install snowflake-cli"
branding:
  icon: "terminal"
  color: "blue"

inputs:
  cli-version:
    description: "Snowflake CLI version (by default, installs the latest version)"
    required: false

  default-config-file-path:
    description: "Path to the default config file"
    required: false
    default: "./config.toml"

  custom-github-ref:
    description: "GitHub branch, tag, or commit to install from (if set, installs from GitHub; otherwise, installs from PyPI)"
    required: false

  cli-artifact:
    description: >-
      Path to a local Snowflake CLI wheel, sdist, or directory of wheels.
      Installed with uv --offline (no PyPI). uv and python3 must already be on PATH.
      Mutually exclusive with cli-version and custom-github-ref. Air-gapped runners
      can instead preinstall snow on PATH and leave cli-version, custom-github-ref,
      and cli-artifact empty to skip the download entirely.
    required: false
    default: ""

  use-oidc:
    description: "Enable OIDC authentication"
    required: false
    default: "false"

  oidc-token-name:
    description: >-
      "Name of the token environment variable for OIDC authentication."
      " By default it's set for [temporary connections](https://docs.snowflake.com/en/developer-guide/snowflake-cli/connecting/configure-connections#use-a-temporary-connection), "
      "however it can be changed to SNOWFLAKE_CONNECTIONS_<NAME>_TOKEN to work with named connections."
    required: false
    default: "SNOWFLAKE_TOKEN"

  oidc-audience:
    description: >-
      Audience (aud) claim requested for the GitHub OIDC token. Defaults to
      snowflakecomputing.com. AWS ISO and other in-zone accounts must set this
      to the audience their Snowflake OIDC security integration expects.
    required: false
    default: "snowflakecomputing.com"

runs:
  using: "composite"
  steps:
    - name: add extra telemetry data
      shell: bash
      env:
        # Bump on each release to match the repository tag
        SF_CICD_INTEGRATION_VERSION: "v2.0"
      run: |
        echo "SF_GITHUB_ACTION=true" >> "$GITHUB_ENV"
        echo "SF_CICD_INTEGRATION_VERSION=$SF_CICD_INTEGRATION_VERSION" >> "$GITHUB_ENV"

    - name: Plan Snowflake CLI install
      id: snow-plan
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
        CUSTOM_GITHUB_REF: ${{ inputs.custom-github-ref }}
        CLI_ARTIFACT: ${{ inputs.cli-artifact }}
      run: bash $GITHUB_ACTION_PATH/scripts/plan-cli-install.sh

    - uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 #v7.1.6
      if: ${{ steps.snow-plan.outputs.skip_uv_setup != 'true' }}
      with:
        python-version: "3.11"

    - name: Install snowflake-cli
      if: ${{ steps.snow-plan.outputs.skip_install != 'true' }}
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
        CUSTOM_GITHUB_REF: ${{ inputs.custom-github-ref }}
        CLI_ARTIFACT: ${{ inputs.cli-artifact }}
      run: bash $GITHUB_ACTION_PATH/scripts/install-snowflake-cli.sh

    - name: Set up config.toml
      shell: bash
      run: bash $GITHUB_ACTION_PATH/scripts/setup-config-file.sh
      env:
        CONFIG_FILE_PATH: ${{ inputs.default-config-file-path }}

    - name: Set up workload identity authentication
      if: ${{ inputs.use-oidc == 'true' }}
      shell: bash
      run: |
        echo "SNOWFLAKE_AUTHENTICATOR=WORKLOAD_IDENTITY" >> "$GITHUB_ENV"
        echo "SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER=OIDC" >> "$GITHUB_ENV"
        echo "SNOWFLAKE_AUDIENCE=${{ inputs.oidc-audience }}" >> "$GITHUB_ENV"
        # GITHUB_ENV applies on the next step. snow auth oidc read-token runs
        # in this step and reads SNOWFLAKE_AUDIENCE from the process environment.
        export SNOWFLAKE_AUDIENCE="${{ inputs.oidc-audience }}"
        TOKEN_NAME_UPPER=$(echo ${{ inputs.oidc-token-name }} | tr '[:lower:]' '[:upper:]')
        echo "${TOKEN_NAME_UPPER}=$(snow auth oidc read-token --type=github)" >> "$GITHUB_ENV"
